# This configuration file specifies available datasets for model training and evaluation.
# Each dataset entry includes:
#   - dataset_path: The absolute path to the dataset folder.
#   - dataset_type: "vlm" for vision-language multimodal datasets or "vla" for embodied action datasets.
#   - sample_ratio: The sampling ratio for training (usually set to 1.0).
#   - use_quantile: Whether quantile-based normalization is used.
#     For VLA datasets ("dataset_type: vla"), this should be explicitly set according to dataset stats.
#     For VLM datasets ("dataset_type: vlm"), quantile-based normalization is **not required**
#     and you may omit the `use_quantile` field.
# 
# Edit this file to add, remove, or update dataset sources as needed for your training and evaluation pipeline.

